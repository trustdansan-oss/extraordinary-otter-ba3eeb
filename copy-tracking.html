<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy Tracking Code | Northstar Logistics</title><style>body{margin:0;background:#f2f6fc;color:#142b4d;font-family:Arial,Helvetica,sans-serif;padding:24px 14px}.card{max-width:480px;margin:8vh auto;background:#fff;border:1px solid #dce6f3;border-radius:18px;padding:26px 20px;text-align:center;box-shadow:0 12px 32px #1233}h1{font-size:24px;color:#0757cf;margin:0 0 10px}.code{padding:18px 12px;border:2px dashed #075cff;border-radius:12px;background:#f2f7ff;font-size:25px;font-weight:800;overflow-wrap:anywhere;letter-spacing:1px}.btn{margin-top:16px;background:#ffd43b;color:#10233d;border:1px solid #d69b0b;border-radius:9px;padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer}.note{font-size:13px;color:#60718a;line-height:1.5}</style></head><body><main class="card"><h1>Northstar Logistics</h1><p>Shipment tracking code</p><div class="code" id="code">Loading…</div><button class="btn" id="copy">COPY TRACKING CODE</button><p class="note" id="note">Tap the button to copy your code.</p><p><a href="/#home">Track your shipment</a></p></main><script>const q=new URLSearchParams(location.search);const code=q.get('code')||'';const el=document.getElementById('code'),note=document.getElementById('note');el.textContent=code||'No tracking code provided';document.getElementById('copy').addEventListener('click',async()=>{if(!code){note.textContent='No tracking code was provided.';return}try{await navigator.clipboard.writeText(code);note.textContent='Tracking code copied successfully.'}catch(e){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);note.textContent='Your code is selected. Tap Copy from your browser menu.'}});</script></body></html>
